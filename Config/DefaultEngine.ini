; ============================================================================
; Gielinor - engine config
; Desktop (Windows, SM6/DX12): Lumen GI + reflections, Nanite, Virtual Shadow Maps, TSR.
; Quest / Android (see [/Script/AndroidRuntimeSettings...] and Config/Android/AndroidEngine.ini):
;   mobile forward renderer, MSAA 4x, mobile multiview, Vulkan only, no Lumen/Nanite, OpenXR start in VR.
; ============================================================================

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Gielinor/Maps/StarterTown.StarterTown
GameDefaultMap=/Game/Gielinor/Maps/StarterTown.StarterTown
GlobalDefaultGameMode=/Script/Gielinor.GielinorGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.Engine]
AssetManagerClassName=/Script/Gielinor.GielinorAssetManager
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/Gielinor")

[/Script/Engine.RendererSettings]
; ---- Desktop high end ----
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.HardwareRayTracing=False
r.Shadow.Virtual.Enable=1
; Nanite off: packaged build crashed in FNaniteRasterPipelines on weak integrated GPUs.
r.Nanite.ProjectEnabled=False
r.Nanite=0
r.Nanite.AllowTessellation=0
r.AntiAliasingMethod=4
r.GenerateMeshDistanceFields=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=False
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True
r.RayTracing=False
r.CustomDepth=3
; ---- Mobile / Quest ----
r.MobileHDR=False
r.Mobile.ShadingPath=1
r.Mobile.AntiAliasing=3
r.MSAACount=4
vr.MobileMultiView=True
vr.InstancedStereo=True
r.Mobile.SupportGPUScene=False
r.ForwardShading=False
r.Mobile.AllowDitheredLODTransition=False
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.AllowDistanceFieldShadows=False
r.Mobile.AllowMovableDirectionalLights=True
r.Mobile.EnableMovableSpotlightsShadow=False
r.Mobile.Forward.EnableLocalLights=1
xr.OpenXRAcquireMode=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DX11 default: Intel UHD laptops crashed in FNaniteRasterPipelines under DX12/SM6.
; SM5 only, so no Nanite shaders/pipelines get cooked at all. Launch with -dx12 to opt in.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX11
-D3D12TargetedShaderFormats=PCD3D_SM6
+D3D12TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5
-VulkanTargetedShaderFormats=SF_VULKAN_SM6
+VulkanTargetedShaderFormats=SF_VULKAN_SM5

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Meta Quest 2/3/3S/Pro standalone via OpenXR.
PackageName=com.doubleastandard.gielinor
ApplicationDisplayName=Gielinor
MinSDKVersion=32
TargetSDKVersion=32
bPackageDataInsideApk=True
bSupportsVulkan=True
bBuildForES31=False
bSupportsVulkanSM5=False
+PackageForOculusMobile=Quest2
+PackageForOculusMobile=Quest3
bRemoveOSIG=True
Orientation=Landscape
bFullScreen=True
bBuildForArm64=True
bBuildForX8664=False
bShowLaunchImage=False
bEnableGooglePlaySupport=False
TextureFormatPriority_ASTC=0.9
bMultiTargetFormat_ETC2=False
bMultiTargetFormat_DXT=False
bMultiTargetFormat_ASTC=True

[/Script/OpenXRHMD.OpenXRHMDSettings]
bIsFBFoveationEnabled=True
FBFoveationLevel=High
bIsFBFoveationDynamic=True

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.PhysicsSettings]
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6

[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Static
AgentRadius=34.0
AgentHeight=176.0
CellSize=10.0

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bAllowClientSideNavigation=False

[/Script/Engine.CollisionProfile]
; Interactables block Visibility so cursor traces and VR lasers can hit them.

[/Script/Engine.StreamingSettings]
s.AsyncLoadingThreadEnabled=True

[SystemSettings]
; Start every new install on Low (same rule as the web build); players raise it in settings.
sg.ResolutionQuality=100

[/Script/Engine.UserInterfaceSettings]
ApplicationScale=1.0

[ConsoleVariables]
; Live in editor too.
r.VSync=0

[DevOptions.Shaders]
; Low-RAM laptop: fewer parallel ShaderCompileWorkers to avoid OOM during cook
NumUnusedShaderCompilingThreads=4
NumUnusedShaderCompilingThreadsDuringGame=4
