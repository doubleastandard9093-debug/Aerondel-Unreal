; Gielinor scalability. Game tiers (UGielinorScalability): Quest=0 Low=1 High=2 Ultra=4(Cinematic).
; Quality index 0..4 per group: Low, Medium, High, Epic, Cinematic.

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.5
[ViewDistanceQuality@1]
r.ViewDistanceScale=0.75
[ViewDistanceQuality@2]
r.ViewDistanceScale=1.0
[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0
[ViewDistanceQuality@Cine]
r.ViewDistanceScale=1.5

[ShadowQuality@0]
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=1024
[ShadowQuality@1]
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
; Low: softer PCF shadow edges (no stair-stepping) for the cost of a few extra taps
r.ShadowQuality=3
r.Shadow.CSM.TransitionScale=1.0
r.Shadow.RadiusThreshold=0.05
[ShadowQuality@2]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0
[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
[ShadowQuality@Cine]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.5

[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=0
r.Lumen.DiffuseIndirect.Allow=0
[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=0
r.Lumen.DiffuseIndirect.Allow=0
r.SSGI.Enable=1
[GlobalIlluminationQuality@2]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
[GlobalIlluminationQuality@Cine]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=8

[ReflectionQuality@0]
r.ReflectionMethod=0
[ReflectionQuality@1]
r.ReflectionMethod=2
[ReflectionQuality@2]
r.ReflectionMethod=1
[ReflectionQuality@3]
r.ReflectionMethod=1
[ReflectionQuality@Cine]
r.ReflectionMethod=1
r.Lumen.Reflections.HardwareRayTracing=1

[AntiAliasingQuality@0]
[AntiAliasingQuality@1]
r.TSR.History.ScreenPercentage=100
; Low: smoother edges on round props without TSR's costlier passes
r.TSR.ShadingRejection.Flickering=1
r.TSR.Velocity.WeightClampingSampleCount=1
[AntiAliasingQuality@2]
[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=200
[AntiAliasingQuality@Cine]
r.TSR.History.ScreenPercentage=200

[FoliageQuality@0]
foliage.DensityScale=0.3
grass.DensityScale=0.3
[FoliageQuality@1]
foliage.DensityScale=0.6
grass.DensityScale=0.6
[FoliageQuality@2]
foliage.DensityScale=1.0
grass.DensityScale=1.0
[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0
[FoliageQuality@Cine]
foliage.DensityScale=1.5
grass.DensityScale=1.5

; ---- Texture filtering: crisp-but-smooth surfaces at grazing angles (cheap on UHD) ----
[TextureQuality@0]
r.MaxAnisotropy=2
r.Streaming.MipBias=1
[TextureQuality@1]
r.MaxAnisotropy=4
r.Streaming.MipBias=0
r.Streaming.PoolSize=400
[TextureQuality@2]
r.MaxAnisotropy=8
r.Streaming.MipBias=0
[TextureQuality@3]
r.MaxAnisotropy=16
r.Streaming.MipBias=0
[TextureQuality@Cine]
r.MaxAnisotropy=16
r.Streaming.MipBias=0

; ---- Post: Low gets 1-level SSAO (soft contact darkening = rounder look) and dithered tonemap (no banding) ----
[PostProcessQuality@0]
r.AmbientOcclusionLevels=0
r.Tonemapper.GrainQuantization=1
[PostProcessQuality@1]
r.AmbientOcclusionLevels=1
r.AmbientOcclusionRadiusScale=1.4
r.Tonemapper.GrainQuantization=1
r.BloomQuality=3
r.Tonemapper.Sharpen=0
[PostProcessQuality@2]
r.AmbientOcclusionLevels=2
r.Tonemapper.GrainQuantization=1
r.BloomQuality=4
r.Tonemapper.Sharpen=0.3
[PostProcessQuality@3]
r.AmbientOcclusionLevels=3
r.Tonemapper.GrainQuantization=1
r.BloomQuality=5
r.Tonemapper.Sharpen=0.5
[PostProcessQuality@Cine]
r.AmbientOcclusionLevels=3
r.BloomQuality=5
r.Tonemapper.Sharpen=0.5


; ---- Effects: sky/atmosphere precision on High/Epic only ----
[EffectsQuality@1]
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.SampleCountMax=8
[EffectsQuality@2]
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.SampleCountMax=32
r.VolumetricFog.GridSizeZ=64
[EffectsQuality@3]
r.SkyAtmosphere.FastSkyLUT=0
r.SkyAtmosphere.SampleCountMax=64
r.VolumetricFog.GridSizeZ=128
r.VolumetricCloud.ShadowMap.MaxResolution=1024
[EffectsQuality@Cine]
r.SkyAtmosphere.FastSkyLUT=0
r.SkyAtmosphere.SampleCountMax=128
r.VolumetricFog.GridSizeZ=128
